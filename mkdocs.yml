site_name: MomaPy
site_url: https://adrienrougny.github.io/momapy/
hooks:
  # brand every prose mention of momapy as MomaPy
  - mkdocs_extensions/brand.py
  # set fenced code blocks in titled frames, like notebook cells
  - mkdocs_extensions/code_frames.py
nav:
  - Home: index.md
  - User manual: user_manual/main.ipynb
  - Styling: styling.md
  - CLI reference: cli.md
  - API reference:
    - Overview: api_reference/index.md
    - Core: api_reference/core.md
    - Builder: api_reference/builder.md
    - Drawing: api_reference/drawing.md
    - Coloring: api_reference/coloring.md
    - Geometry: api_reference/geometry.md
    - I/O: api_reference/io.md
    - Positioning: api_reference/positioning.md
    - Styling: api_reference/styling.md
    - Rendering:
      - Core: api_reference/rendering/core.md
      - Skia: api_reference/rendering/skia.md
      - Cairo: api_reference/rendering/cairo.md
      - SVG-native: api_reference/rendering/svg_native.md
    - SBGN:
      - SBGN: api_reference/sbgn/sbgn.md
      - PD: api_reference/sbgn/pd.md
      - AF: api_reference/sbgn/af.md
      - I/O:
        - SBGN-ML: api_reference/sbgn/io/sbgnml.md
    - CellDesigner:
      - CellDesigner: api_reference/celldesigner/celldesigner.md
      - I/O:
        - CD: api_reference/celldesigner/io/celldesigner.md
    - SBML:
      - SBML: api_reference/sbml/sbml.md
      - I/O:
        - SBML: api_reference/sbml/io/sbml.md
  - Changelog: CHANGELOG.md
  - About: about.md
theme:
  name: shadcn
  favicon: assets/favicon.svg
  icon: assets/favicon.svg
  # top-level sections go in the top bar, so the sidebar can nest deeper
  topbar_sections: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/layout.js
  - javascripts/code_frames.js
  - javascripts/scrollbars.js
plugins:
  - mkdocs-jupyter:
      ignore_h1_titles: True
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            inherited_members: true
            group_by_category: false # to group by category
            show_category_heading: false # to give a title to the category
            show_root_heading: true # to show the root's title
            parameter_headings: false
            show_signature_annotations: true
            separate_signature: true # to give the signature on a separate line
            show_symbol_type_heading: true # to show the type of the object in the heading
            show_symbol_type_toc: true # to show the type of the object in the toc
            show_if_no_docstring: false
            signature_crossrefs: true
            merge_init_into_class: true
            show_inheritance_diagram: false # does not work
            summary: true
            extensions:
              - griffe_fieldz: {include_inherited: true}
              - griffe_inherited_docstrings
              # local: backfill overridden field descriptions from base classes;
              # must run after griffe_fieldz
              - mkdocs_extensions/inherited_field_descriptions.py:InheritedFieldDescriptions
markdown_extensions:
  - tables
  - toc:
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
