[project]
name = "momapy"
dynamic = ["version"]
description = "A library to work with molecular maps"
authors = [{ name = "Adrien Rougny", email = "adrienrougny@gmail.com" }]
dependencies = [
  "frozendict>=2.3.10",
  "numpy>=1.26.2",
  "pyparsing>=3.1.1",
  "colorama>=0.4.6",
  "lxml>=5.3.2",
  "uharfbuzz>=0.53.0",
  "typing-extensions>=4.15.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/adrienrougny/momapy"
Issues = "https://github.com/adrienrougny/momapy/issues"

[project.optional-dependencies]
skia = ["skia-python>=138.0"]
cairo = ["pycairo>=1.29.0", "pygobject>=3.54.5"]
notebook = ["ipython", "pygments"]
all = ["momapy[cairo, skia, notebook]"]

[dependency-groups]
dev = [
    "griffe-fieldz>=0.1.2",
    "mkdocstrings-python>=1.16.12",
    "mkdocs-shadcn>=0.12.1",
    "griffe-inherited-docstrings>=1.1.1",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-pygments>=0.0.2",
    "ruff>=0.14.10,<0.15",
    "monkeytype>=23.3.0",
    "pre-commit>=4.5.1",
    "git-cliff>=2.12.0",
    { include-group = "test" },
    "jupyterlab>=4.5.6",
]
test = ["pytest>=9.0.2", "pytest-cov>=6.0.0"]

[project.scripts]
momapy = "momapy.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = '^v(?P<version>([0-9].*))'

[tool.hatch.build.targets.wheel]
packages = ["src/momapy"]

[tool.ruff.lint]
extend-select = ["D", "ANN"]
ignore = ["ANN401", "ANN002", "ANN003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true
suppress-none-returning = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (roundtrip, rendering)",
]

[tool.coverage.run]
source = ["src/momapy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
